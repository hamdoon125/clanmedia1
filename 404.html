<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الصفحة مش موجودة | Clan Agency</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#021a4d">
<link rel="icon" type="image/png" href="/images/ui/ui-00.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;800&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#021a4d;--navy2:#032a74;--violet:#2f6bff;--lilac:#b9cdf5;--paper:#f2f6ff;--pink:#ffc94d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:radial-gradient(900px 600px at 50% 30%,#0b3aa8 0%,#05246e 45%,var(--navy) 80%);color:var(--paper);font-family:'Noto Kufi Arabic','Segoe UI',Tahoma,sans-serif;overflow-x:hidden}
header{display:flex;justify-content:center;padding:26px 16px 0}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font:800 18px/1 Poppins,'Segoe UI',sans-serif;letter-spacing:1.5px}
.logo img{width:34px;height:34px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px 48px}
.n{position:relative;font:800 clamp(110px,30vw,220px)/1 Poppins,sans-serif;letter-spacing:-4px;color:transparent;-webkit-text-stroke:2px rgba(185,205,245,.35);direction:ltr;user-select:none}
.n span{display:inline-block;animation:bob 3.2s ease-in-out infinite}
.n span:nth-child(2){color:var(--pink);-webkit-text-stroke:0;text-shadow:0 0 40px rgba(255,201,77,.55);animation-delay:.25s}
.n span:nth-child(3){animation-delay:.5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{margin:14px 0 8px;font-size:clamp(24px,6vw,36px);line-height:1.4}
p{margin:0 auto;max-width:30em;color:var(--lilac);font-size:17px;line-height:1.8}
.en{margin-top:6px;font-family:Poppins,'Segoe UI',sans-serif;font-size:14px;opacity:.75;direction:ltr}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px;width:100%;max-width:440px}
.btn{flex:1 1 180px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 22px;border-radius:999px;font:700 16px/1.2 'Noto Kufi Arabic',sans-serif;text-decoration:none;transition:transform .25s,box-shadow .25s}
.btn.y{background:var(--pink);color:var(--navy);box-shadow:0 10px 30px rgba(255,201,77,.3)}
.btn.o{border:1.5px solid rgba(185,205,245,.5);color:var(--paper)}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media(prefers-reduced-motion:reduce){.n span{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<header><a class="logo" href="/"><img src="/images/ui/ui-01.webp" alt="" width="34" height="34">CLAN AGENCY</a></header>
<main>
  <div class="n" aria-hidden="true"><span>4</span><span>0</span><span>4</span></div>
  <h1>الصفحة دي مش موجودة</h1>
  <p>ممكن يكون اللينك مكتوب غلط، أو الصفحة اتنقلت. ارجع للرئيسية وشوف شغلنا، أو كلمنا على طول.</p>
  <p class="en">This page doesn't exist. Head back home or message us on WhatsApp.</p>
  <div class="btns">
    <a class="btn y" href="/">الصفحة الرئيسية</a>
    <a class="btn o" href="https://wa.me/201556639413" target="_blank" rel="noopener">كلمنا واتساب</a>
  </div>
</main>
</body>
</html>
